version: "3.8"

services:
    # Laravel Application
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: relate-organizer-app
        container_name: relate_app
        restart: unless-stopped
        tty: true
        environment:
            SERVICE_NAME: app
            SERVICE_TAGS: dev
        volumes:
            - ./:/var/www
            - /var/www/vendor
            - /var/www/node_modules
        depends_on:
            - db

    # Nginx Web Server
    nginx:
        image: nginx:alpine
        container_name: relate_nginx
        restart: unless-stopped
        tty: true
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www
            - ./docker-compose/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app

    # MySQL Database
    db:
        image: mysql:8.0
        container_name: relate_db
        restart: unless-stopped
        tty: true
        ports:
            - "3306:3306"
        environment:
            MYSQL_DATABASE: relate_organizer
            MYSQL_ROOT_PASSWORD: root
            MYSQL_PASSWORD: root
        volumes:
            - dbdata:/var/lib/mysql

volumes:
    dbdata:
        driver: local
